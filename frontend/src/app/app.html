<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-white/[0.06] bg-ink-900/80 px-4 py-6 backdrop-blur-xl transition-transform lg:sticky lg:top-0 lg:h-screen lg:translate-x-0"
    [class.-translate-x-full]="!navOpen()">
    <a routerLink="/" class="flex items-center gap-3 px-2">
      <span class="grid size-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-400 via-violet-500 to-fuchsia-500 shadow-lg shadow-violet-500/30">
        <svg viewBox="0 0 24 24" class="size-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg>
      </span>
      <span class="text-lg font-semibold tracking-tight text-white">SalesPulse</span>
    </a>

    <p class="mt-8 px-3 text-[11px] font-semibold uppercase tracking-widest text-slate-500">Workspace</p>
    <nav class="mt-3 flex flex-col gap-1">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
          (click)="navOpen.set(false)"
          class="group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-white/[0.04] hover:text-white [&.active-link]:bg-gradient-to-r [&.active-link]:from-indigo-500/20 [&.active-link]:to-transparent [&.active-link]:text-white">
          <span class="absolute inset-y-2 left-0 w-0.5 rounded-full bg-indigo-400 opacity-0 transition group-[.active-link]:opacity-100"></span>
          <app-icon [name]="item.icon" class="size-5" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="glass mt-auto p-4">
      <p class="text-sm font-medium text-white">Demo workspace</p>
      <p class="mt-1 text-xs leading-relaxed text-slate-400">Angular 22 · .NET 10 · SQL Server. Data is generated on first run.</p>
    </div>
  </aside>

  @if (navOpen()) {
    <div class="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm lg:hidden" (click)="navOpen.set(false)"></div>
  }

  <!-- Content -->
  <main class="min-w-0 flex-1 px-4 py-6 sm:px-8 lg:px-10 lg:py-8">
    <button type="button" class="btn mb-6 lg:hidden" (click)="navOpen.set(true)" aria-label="Open navigation">
      <app-icon name="menu" class="size-5" /> Menu
    </button>
    <div class="mx-auto max-w-[1400px]">
      <router-outlet />
    </div>
  </main>
</div>
